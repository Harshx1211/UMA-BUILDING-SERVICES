# Deploy with: fly launch --no-deploy (first time, to create this app) then
# fly deploy. See README.md for the paired Gotenberg app and private
# networking setup this depends on.
app = "sitetrack-report-generator"
primary_region = "syd"

[build]

[env]
  GOTENBERG_URL = "http://sitetrack-gotenberg.internal:3000"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
